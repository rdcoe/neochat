version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: neochat-postgres
    environment:
      POSTGRES_USER: neochat_dev
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: neochat_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - neochat-network

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: neochat-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
      MONGO_INITDB_DATABASE: neochat_dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - neochat-network

  # Apache Kafka with Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: neochat-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - neochat-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: neochat-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - neochat-network

  # HashiCorp Vault
  vault:
    image: hashicorp/vault:1.15
    container_name: neochat-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - neochat-network

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: neochat-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: neochat_dev
      KC_DB_PASSWORD: dev_password
    ports:
      - "8180:8080"
    depends_on:
      - postgres
    networks:
      - neochat-network

volumes:
  postgres-data:
  mongodb-data:

networks:
  neochat-network:
    driver: bridge
