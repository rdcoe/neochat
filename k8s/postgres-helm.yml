# PostgreSQL Helm Chart Configuration
# Install with: helm install postgresql bitnami/postgresql -f postgres-helm.yml -n neochat

global:
  postgresql:
    auth:
      username: neochat
      password: neochat_prod_password
      database: neochat

primary:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "standard"
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  initdb:
    scripts:
      init.sql: |
        -- Create chat_events table with partitioning
        CREATE TABLE IF NOT EXISTS chat_events (
            id UUID PRIMARY KEY,
            conversation_id VARCHAR(255) NOT NULL,
            event_type VARCHAR(50) NOT NULL,
            payload TEXT,
            user_id VARCHAR(255) NOT NULL,
            timestamp TIMESTAMP NOT NULL
        ) PARTITION BY RANGE (timestamp);

        -- Create partitions for current and next month
        CREATE TABLE chat_events_default PARTITION OF chat_events DEFAULT;

        CREATE INDEX idx_chat_events_conversation ON chat_events(conversation_id);
        CREATE INDEX idx_chat_events_timestamp ON chat_events(timestamp);

        -- Create audit_logs table
        CREATE TABLE IF NOT EXISTS audit_logs (
            id UUID PRIMARY KEY,
            timestamp TIMESTAMP NOT NULL,
            user_id VARCHAR(255) NOT NULL,
            action VARCHAR(100) NOT NULL,
            resource_type VARCHAR(100) NOT NULL,
            resource_id VARCHAR(255),
            ip_address VARCHAR(45),
            user_agent TEXT,
            status VARCHAR(50) NOT NULL,
            details TEXT
        );

        CREATE INDEX idx_audit_logs_user ON audit_logs(user_id);
        CREATE INDEX idx_audit_logs_timestamp ON audit_logs(timestamp);
        CREATE INDEX idx_audit_logs_resource ON audit_logs(resource_type, resource_id);

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
