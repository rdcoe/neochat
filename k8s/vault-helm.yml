# HashiCorp Vault Helm Chart Configuration
# Install with: helm install vault hashicorp/vault -f vault-helm.yml -n neochat

server:
  dev:
    enabled: false
  
  standalone:
    enabled: true
    config: |
      ui = true
      
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      
      storage "file" {
        path = "/vault/data"
      }

  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: "standard"

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  service:
    enabled: true
    type: ClusterIP
    port: 8200

  ingress:
    enabled: false

ui:
  enabled: true
  serviceType: "ClusterIP"

# Initialize Vault after deployment with:
# kubectl exec -it vault-0 -n neochat -- vault operator init
# kubectl exec -it vault-0 -n neochat -- vault operator unseal <unseal-key>
# kubectl exec -it vault-0 -n neochat -- vault login <root-token>
# kubectl exec -it vault-0 -n neochat -- vault secrets enable -path=secret kv-v2
