# Kafka with Strimzi Operator
# Install Strimzi operator first: kubectl create -f 'https://strimzi.io/install/latest?namespace=neochat' -n neochat
# Then apply this file: kubectl apply -f kafka-strimzi.yml -n neochat

apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: neochat-cluster
  namespace: neochat
spec:
  kafka:
    version: 3.6.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: "3.6"
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 10Gi
          deleteClaim: false
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1000m
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 5Gi
      deleteClaim: false
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
  entityOperator:
    topicOperator: {}
    userOperator: {}

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: chat-events
  namespace: neochat
  labels:
    strimzi.io/cluster: neochat-cluster
spec:
  partitions: 10
  replicas: 3
  config:
    retention.ms: 2592000000  # 30 days
    segment.bytes: 1073741824
    compression.type: producer
